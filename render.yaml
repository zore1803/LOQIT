services:
  - type: web
    name: loqit-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: MONGO_URI
        sync: false # paste in Render dashboard (secret)
      - key: MONGO_DB
        value: loqit
      - key: SUPABASE_URL
        value: https://qnyukwxgrvrfwhrsaepj.supabase.co
      - key: APP_SECRET
        sync: false # paste in Render dashboard (secret)
      - key: CORS_ORIGINS
        value: "*"
